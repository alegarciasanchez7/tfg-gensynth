# GitLab mirror pipeline: same checks as the GitHub CI on Linux.
# SonarQube runs only from GitHub, so both pipelines do not report to the same project.
stages:
  - test

default:
  interruptible: true

frontend:
  stage: test
  image: node:22
  cache:
    key:
      files: [simulator-ui/package-lock.json]
    paths: [.npm/]
  before_script:
    - cd simulator-ui
    - npm ci --cache ../.npm --prefer-offline
  script:
    - npm run lint
    - npm run typecheck
    - npm run test:coverage
    - npm run build
  # Line coverage from the Vitest text summary, shown in merge requests
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'

backend:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  variables:
    MAVEN_OPTS: -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
  cache:
    key:
      files: [core/pom.xml, plugin-api/pom.xml]
    paths: [.m2/repository/]
  # The image has no Node, so the UI is built and checked by the frontend job
  script:
    - mvn -B verify -DskipUi=true
  artifacts:
    when: always
    reports:
      junit:
        - core/target/surefire-reports/TEST-*.xml
        - plugin-api/target/surefire-reports/TEST-*.xml
