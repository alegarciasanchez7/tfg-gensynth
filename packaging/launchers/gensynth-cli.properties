# Second jpackage launcher: the "gensynth" command line (headless shell, no window).
# Named gensynth-cli because Windows and macOS file systems ignore case, so "gensynth"
# would clash with the GenSynth launcher. Each OS exposes it as "gensynth" (see USER_GUIDE.md).
# Keys left out (java-options, icon...) are inherited from the main launcher.
main-class=com.gensynth.core.cli.CliMain
description=GenSynth command line
# Windows: attach the launcher to the console so the shell can read and print
win-console=true
# No menu entries or desktop shortcuts for a terminal command
win-shortcut=false
win-menu=false
linux-shortcut=false
