# SonarQube Cloud analysis of the whole repository (Java + TypeScript), run from .github/workflows/ci.yml
sonar.organization=alegarciasanchez7
sonar.projectKey=alegarciasanchez7_tfg-gensynth
sonar.projectName=GenSynth
sonar.sourceEncoding=UTF-8

# Sources and tests (the UI keeps its tests next to the code)
sonar.sources=core/src/main/java,plugin-api/src/main/java,simulator-ui/src
sonar.tests=core/src/test/java,plugin-api/src/test/java,simulator-ui/src
sonar.exclusions=simulator-ui/src/**/*.test.ts,simulator-ui/src/**/*.test.tsx,simulator-ui/src/test/**
sonar.test.inclusions=simulator-ui/src/**/*.test.ts,simulator-ui/src/**/*.test.tsx,simulator-ui/src/test/**,**/src/test/java/**

# Java
sonar.java.source=21
sonar.java.binaries=core/target/classes,plugin-api/target/classes
sonar.java.libraries=core/target/dependency/*.jar
sonar.java.test.binaries=core/target/test-classes,plugin-api/target/test-classes

# Coverage reports (JaCoCo for Java, lcov from Vitest for TypeScript)
sonar.coverage.jacoco.xmlReportPaths=core/target/site/jacoco/jacoco.xml,plugin-api/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=simulator-ui/coverage/lcov.info
