# Continuous integration: lint, type-check, test and build every push and pull request,
# on the three desktop operating systems, and analyse the code with SonarQube Cloud.
name: CI

on:
  push:
    branches: [main, pre-build, 'feat/**', 'fix/**', 'ci/**']
  pull_request:
    branches: [main, pre-build]
  workflow_dispatch:

# A new push to the same branch cancels the run that is still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator-ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: simulator-ui/.nvmrc
          cache: npm
          cache-dependency-path: simulator-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: simulator-ui/coverage/lcov.info
          retention-days: 7

  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The core build runs npm to bundle the UI into the JAR
      - uses: actions/setup-node@v7
        with:
          node-version-file: simulator-ui/.nvmrc
          cache: npm
          cache-dependency-path: simulator-ui/package-lock.json

      - name: Build and test
        if: runner.os != 'Windows'
        run: ./mvnw -B verify

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.os }}
          path: '**/target/surefire-reports/'
          retention-days: 7

  sonar:
    name: SonarQube analysis
    needs: frontend
    runs-on: ubuntu-latest
    # Pull requests from forks have no access to the secrets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check SonarQube token
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::error::The SONAR_TOKEN secret is not set. Create it in Settings > Secrets and variables > Actions."
          exit 1

      - uses: actions/checkout@v7
        with:
          # Full history so SonarQube can tell new code from old code
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiled classes, dependencies and JaCoCo reports for the Java analysis
      - name: Build and test (with coverage)
        run: ./mvnw -B verify -DskipUi=true

      - name: Download frontend coverage
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: simulator-ui/coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          # Fail the job when the Quality Gate fails
          args: -Dsonar.qualitygate.wait=true
