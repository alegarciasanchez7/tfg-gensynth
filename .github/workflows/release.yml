# Continuous delivery: builds the installers of every OS with jpackage and publishes them in a
# GitHub Release when a version tag (v1.2.3) is pushed. Each OS gets two: the full application
# (GenSynth-installer-*) and the CLI edition, the command line alone (GenSynth-cli-installer-*).
# Releases are only made from main. Pull requests that change the packaging, and manual runs
# (workflow_dispatch), are dry runs: they build the installers as downloadable artifacts of the
# run and publish nothing. A manual run can build only some systems and one edition: that is how
# scripts/*/package builds the installers of the systems other than the developer's.
name: Release

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [dev, main]
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - core/pom.xml
      - .github/smoke/**
  workflow_dispatch:
    inputs:
      os:
        description: 'Systems, separated by commas: linux, windows, macos or all'
        default: all
        type: string
      edition:
        description: Edition
        default: both
        type: choice
        options: [both, full, cli]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  version-check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      matrix: ${{ steps.systems.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and branches, to check that the tag is on main
          fetch-depth: 0

      # plugin-api/pom.xml is not listed: the plugin API is a contract with its own version
      - name: Check that every file declares the same version
        id: check
        run: |
          set -euo pipefail
          declare -A versions=(
            [pom.xml]=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)
            [core/pom.xml]=$(grep -m1 -oP '(?<=<version>)[^<]+' core/pom.xml)
            [ui/package.json]=$(node -p "require('./ui/package.json').version")
            [ui/src/app/core/appInfo.ts]=$(grep -oP "(?<=APP_VERSION = ')[^']+" ui/src/app/core/appInfo.ts)
            [sonar-project.properties]=$(grep -oP '(?<=^sonar.projectVersion=).+' sonar-project.properties)
          )
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected="${GITHUB_REF_NAME#v}"
          else
            expected="${versions[pom.xml]}"
          fi
          failed=0
          for file in "${!versions[@]}"; do
            if [[ "${versions[$file]}" != "$expected" ]]; then
              echo "::error file=$file::Version ${versions[$file]} does not match $expected"
              failed=1
            fi
          done
          [[ $failed == 0 ]] || exit 1
          echo "Version $expected"
          echo "version=$expected" >> "$GITHUB_OUTPUT"

      - name: Check that the tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Merge dev into main and tag main."
            exit 1
          fi

      # Every system, except in a manual run that asks for some of them
      - name: Select the systems
        id: systems
        env:
          SYSTEMS: ${{ inputs.os || 'all' }}
        run: |
          set -euo pipefail
          entries=()
          for os in $(echo "$SYSTEMS" | tr ',' ' '); do
            case "$os" in
              all) entries=(windows linux macos); break ;;
              windows|linux|macos) entries+=("$os") ;;
              *) echo "::error::Unknown system '$os': use linux, windows, macos or all"; exit 1 ;;
            esac
          done
          include=()
          for os in $(printf '%s\n' "${entries[@]}" | sort -u); do
            case "$os" in
              windows) include+=('{"os":"windows-latest","label":"windows-x64"}') ;;
              linux) include+=('{"os":"ubuntu-latest","label":"linux-x64"}') ;;
              macos) include+=('{"os":"macos-latest","label":"macos-arm64"}') ;;
            esac
          done
          matrix="{\"include\":[$(IFS=,; echo "${include[*]}")]}"
          echo "Systems: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Installer (${{ matrix.label }})
    needs: version-check
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version-check.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version-check.outputs.version }}
      # Both editions, except in a manual run that asks for one
      EDITION: ${{ inputs.edition || 'both' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The core build bundles the UI with npm
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the RPM tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # jpackage (JDK 21) builds .msi files with WiX Toolset 3
      - name: Install WiX Toolset 3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 --no-progress -y
          }
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' | Select-Object -First 1
          if ($wix) { Join-Path $wix.FullName 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append }

      - name: Choose the edition
        shell: bash
        run: |
          case "$EDITION" in
            both) flags="" ;;
            full) flags="-Dinstaller.skipCli=true -Dinstaller.skipCliDeb=true -Dinstaller.skipCliRpm=true" ;;
            cli) flags="-Dinstaller.skipFull=true -Dinstaller.skipFullDeb=true -Dinstaller.skipFullRpm=true" ;;
            *) echo "::error::Unknown edition '$EDITION'"; exit 1 ;;
          esac
          echo "INSTALLER_FLAGS=$flags" >> "$GITHUB_ENV"

      - name: Build the installer
        if: runner.os != 'Windows'
        run: ./mvnw -B -Dinstaller -DskipTests $INSTALLER_FLAGS package

      - name: Build the installer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call mvnw.cmd -B -Dinstaller -DskipTests %INSTALLER_FLAGS% package

      # The CLI edition must run without the JCEF libraries, which its installer leaves out
      - name: Smoke test the CLI edition files
        if: env.EDITION != 'full'
        shell: bash
        run: |
          set -euo pipefail
          input=core/target/installer/input-cli
          if ls "$input" | grep -iE 'jcef|jogl|gluegen'; then
            echo "::error::The CLI edition must not ship the JCEF libraries"
            exit 1
          fi
          out="$(printf 'help\nedit new\nsee .github/smoke/file-output.gsynth\nstart .github/smoke/file-output.gsynth\nstop all\nexit\n' \
            | java -Dgensynth.edition=cli -Dgensynth.home="$RUNNER_TEMP/gensynth-smoke" -cp "$input/*" com.gensynth.core.cli.CliMain)"
          echo "$out"
          for expected in "edit is not available in the GenSynth CLI edition" "No problems found" "[1] Started" "[1] Stopped"; do
            grep -qF "$expected" <<< "$out" || { echo "::error::Missing in the output: $expected"; exit 1; }
          done

      - name: Name the installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for file in core/target/installer/dist/*; do
            case "$file" in
              *.msi) cp "$file" "dist/GenSynth-installer-$VERSION.msi" ;;
              *.dmg) cp "$file" "dist/GenSynth-installer-$VERSION.dmg" ;;
              *.deb) cp "$file" "dist/GenSynth-installer-$VERSION.deb" ;;
              *.rpm) cp "$file" "dist/GenSynth-installer-$VERSION.rpm" ;;
            esac
          done
          for file in core/target/installer/dist-cli/*; do
            case "$file" in
              *.msi) cp "$file" "dist/GenSynth-cli-installer-$VERSION.msi" ;;
              *.pkg) cp "$file" "dist/GenSynth-cli-installer-$VERSION.pkg" ;;
              *.deb) cp "$file" "dist/GenSynth-cli-installer-$VERSION.deb" ;;
              *.rpm) cp "$file" "dist/GenSynth-cli-installer-$VERSION.rpm" ;;
            esac
          done
          ls -la dist
          if [[ "$EDITION" != cli ]] && ! ls dist/GenSynth-installer-* >/dev/null 2>&1; then
            echo "::error::No installer was built"; exit 1
          fi
          if [[ "$EDITION" != full ]] && ! ls dist/GenSynth-cli-installer-* >/dev/null 2>&1; then
            echo "::error::No CLI edition installer was built"; exit 1
          fi

      # Installs the CLI edition as a user would and runs the "gensynth" command it sets up
      - name: Install and run the CLI edition (Linux)
        if: runner.os == 'Linux' && env.EDITION != 'full'
        run: |
          set -euo pipefail
          sudo apt-get install -y "./dist/GenSynth-cli-installer-$VERSION.deb"
          gensynth --version | grep -F "(CLI edition)"
          printf 'help\nexit\n' | gensynth | grep -F "Bye."
          sudo apt-get remove -y gensynth-cli
          [[ ! -e /usr/bin/gensynth ]] || { echo "::error::/usr/bin/gensynth was left behind"; exit 1; }

      - name: Install and run the CLI edition (macOS)
        if: runner.os == 'macOS' && env.EDITION != 'full'
        run: |
          set -euo pipefail
          sudo installer -pkg "dist/GenSynth-cli-installer-$VERSION.pkg" -target /
          /usr/local/bin/gensynth --version | grep -F "(CLI edition)"
          printf 'help\nexit\n' | /usr/local/bin/gensynth | grep -F "Bye."

      - name: Install and run the CLI edition (Windows)
        if: runner.os == 'Windows' && env.EDITION != 'full'
        shell: pwsh
        run: |
          $msi = Resolve-Path "dist\GenSynth-cli-installer-$env:VERSION.msi"
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v msi-cli.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content msi-cli.log -Tail 50; exit $install.ExitCode }
          $gensynth = "$env:ProgramFiles\GenSynth-CLI\cli\gensynth.cmd"
          $version = & $gensynth --version
          Write-Output $version
          if ($version -notmatch 'CLI edition') { Write-Error "Unexpected version: $version"; exit 1 }
          $session = "help`nexit`n" | & $gensynth
          Write-Output $session
          if (-not ($session -match 'Bye\.')) { Write-Error 'The command line did not end'; exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the GitHub Release
    needs: [version-check, build]
    # A tag always builds every system and edition (no inputs)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version-check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Checksums and installation notes
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          sed "s/<version>/$VERSION/g" packaging/release-notes.md > release-notes.md

      # The installation notes go first, followed by the notes generated from the merged PRs
      - uses: softprops/action-gh-release@v3
        with:
          name: GenSynth ${{ env.VERSION }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
