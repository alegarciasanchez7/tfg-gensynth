# Weekly dependency updates, grouped to keep the number of pull requests low.
# Pull requests target dev, the integration branch.
version: 2
updates:
  - package-ecosystem: maven
    directories: ['/core', '/plugin-api']
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /simulator-ui
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
