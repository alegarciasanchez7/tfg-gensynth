# Gen-Synth Configuration - YAML Format
# This is the primary configuration file for the Gen-Synth simulator

server:
  host: localhost
  port: 8080
  wsPort: 8081

# Variables/Devices Configuration
devices:
  enabled: true
  defaultCount: 10
  updateInterval: 1000  # milliseconds

# Broker Configurations
brokers:
  mqtt:
    enabled: true
    host: test.mosquitto.org
    port: 1883
    clientId: gen-synth-mqtt-client
    username: null
    password: null
    topics:
      - device/+/data
      - device/+/status

  kafka:
    enabled: false
    brokers: localhost:9092
    topics:
      - gensynth.data
      - gensynth.events
    groupId: gen-synth-group

  rabbitmq:
    enabled: false
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtualHost: /
    exchanges:
      - name: gensynth.exchange
        type: topic
        durable: true

  redis:
    enabled: false
    host: localhost
    port: 6379
    database: 0

# Pipeline Configuration
pipeline:
  bufferSize: 10000
  batchSize: 100
  flushInterval: 5000  # milliseconds
  backpressureThreshold: 8000  # triggers when buffer reaches this size

# Metrics Configuration
metrics:
  enabled: true
  metricsInterval: 5000  # milliseconds
  collectSystemMetrics: true

# Logging Configuration
logging:
  level: INFO
  file: logs/gen-synth.log
  maxFileSize: 10MB
  maxBackupIndex: 5

# Thread Pool Configuration
# IMPORTANT: Conservative defaults for secondary application to avoid contention
#            with main application. Adjust based on your deployment environment.
threadPool:
  coreSize: 2           # Minimum threads (conservative for secondary app)
  maxSize: 4            # Maximum threads (2x core for I/O spikes)
  keepAliveSeconds: 60  # Idle thread lifetime

# FlowEngine Configuration
# Device simulation and data generation settings
flowEngine:
  enabled: true
  devices:
    count: 10              # Number of virtual devices to simulate
    simulationInterval: 1000  # milliseconds between data generation per device
  useVirtualThreads: true    # Use Java 21 virtual threads (recommended for scalability)

# File Output Configuration
# Settings for writing events to .txt/.json files
fileOutput:
  enabled: true
  outputDir: ./outputs  # Base directory for output files (will be created if it doesn't exist)
  flushInterval: 5000   # milliseconds - how often to flush buffered events to disk
